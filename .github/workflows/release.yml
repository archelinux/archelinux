name: "Release ISO"

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Mark as prerelease"
        required: false
        default: "false"
      create_release:
        description: "Also create a GitHub Release"
        required: false
        default: "false"
      tag_name:
        description: "Tag name for the release (default: rolling-YYYYMMDD)"
        required: false
      release_name:
        description: "Release title (default: archelinux YYYY.MM.DD)"
        required: false

jobs:
  verify:
    uses: ./.github/workflows/build-iso.yml
    permissions:
      contents: read
  release:
    name: Sign verified ISO
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: archelinux-iso
          path: /tmp/archiso-out

      - name: "Generate checksums"
        id: sums
        run: |
          ISO_PATH=$(ls -1 /tmp/archiso-out/*.iso | head -n1)
          ISO_NAME=$(basename "$ISO_PATH")
          (cd /tmp/archiso-out && sha256sum "$ISO_NAME" > "$ISO_NAME.sha256")
          echo "iso_path=$ISO_PATH" >> $GITHUB_OUTPUT
          echo "iso_name=$ISO_NAME" >> $GITHUB_OUTPUT
          echo "out_dir=/tmp/archiso-out" >> $GITHUB_OUTPUT

      - name: "Compute release metadata"
        id: meta
        env:
          TAG: ${{ inputs.tag_name }}
          TITLE: ${{ inputs.release_name }}
          ISO_NAME: ${{ steps.sums.outputs.iso_name }}
        run: |
          [[ $ISO_NAME =~ ^archelinux-([0-9]{4}\.[0-9]{2}\.[0-9]{2})-x86_64\.iso$ ]]
          snapshot=${BASH_REMATCH[1]}
          tag=${TAG:-rolling-${snapshot//./}}
          git check-ref-format "refs/tags/$tag"
          title=${TITLE:-archelinux $snapshot}
          [[ $title != *$'\n'* && $title != *$'\r'* ]]
          echo "tag_name=$tag" >> "$GITHUB_OUTPUT"
          echo "release_name=$title" >> "$GITHUB_OUTPUT"

      - name: "Import persistent key and sign"
        env:
          ARCHE_SIGNING_KEY: ${{ secrets.ARCHE_SIGNING_KEY }}
          ARCHE_SIGNING_FINGERPRINT: ${{ secrets.ARCHE_SIGNING_FINGERPRINT }}
          ARCHE_SIGNING_PASSPHRASE: ${{ secrets.ARCHE_SIGNING_PASSPHRASE }}
        run: |
          set -euo pipefail
          test -n "$ARCHE_SIGNING_KEY"
          test -n "$ARCHE_SIGNING_FINGERPRINT"
          printf '%s' "$ARCHE_SIGNING_KEY" | gpg --batch --import
          cd ${{ steps.sums.outputs.out_dir }}
          gpg --armor --export "$ARCHE_SIGNING_FINGERPRINT" > archelinux-release-public.asc
          for file in "${{ steps.sums.outputs.iso_name }}" "${{ steps.sums.outputs.iso_name }}.sha256"; do
            printf '%s' "$ARCHE_SIGNING_PASSPHRASE" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --local-user "$ARCHE_SIGNING_FINGERPRINT" --detach-sign "$file"
          done
          sha256sum --check "${{ steps.sums.outputs.iso_name }}.sha256"
          gpg --verify "${{ steps.sums.outputs.iso_name }}.sig" "${{ steps.sums.outputs.iso_name }}"
          gpg --verify "${{ steps.sums.outputs.iso_name }}.sha256.sig" "${{ steps.sums.outputs.iso_name }}.sha256"
          if (( $(stat -c %s "${{ steps.sums.outputs.iso_name }}") >= 2147483648 )); then
            split -b 1536M -d -a 2 "${{ steps.sums.outputs.iso_name }}" "${{ steps.sums.outputs.iso_name }}.part"
            rm "${{ steps.sums.outputs.iso_name }}"
          fi

      - name: "Upload artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: archelinux-signed-iso
          path: |
            ${{ steps.sums.outputs.out_dir }}/${{ steps.sums.outputs.iso_name }}*
            ${{ steps.sums.outputs.out_dir }}/archelinux-release-public.asc
          if-no-files-found: error

      - name: "Create GitHub Release"
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag_name }}
          TITLE: ${{ steps.meta.outputs.release_name }}
          ISO_DIR: ${{ steps.sums.outputs.out_dir }}
          ISO_NAME: ${{ steps.sums.outputs.iso_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          # Creating a release preserves the assets of every earlier same-day snapshot.
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TITLE" \
            --notes-file docs/next-release.md --generate-notes --prerelease="$PRERELEASE" \
            "$ISO_DIR/$ISO_NAME"* "$ISO_DIR/archelinux-release-public.asc"
