# Proactively migrate idle anonymous pages to compressed ZRAM
vm.swappiness = 180
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
vm.page-cluster = 0

# Filesystem dirty limits for responsive interactive I/O
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10

# High watch limits for massive agentic monorepos
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 1024
