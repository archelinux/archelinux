set -s escape-time 0
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",$TERM:Tc"
set -g mouse on
set -s set-clipboard on
set -g focus-events on

# Keep default backgrounds so Foot and SwayFX can render transparency and blur.
set -g status-style "fg=#bdc1c6,bg=default"
set -g status-interval 0
set -g status-left-length 28
set -g status-left "#[fg=#ccc3d3,bold] #S #[default] "
set -g status-right "#[fg=#bdc1c6] #H "
set -g window-status-format "#[fg=#bdc1c6] #I:#W "
set -g window-status-current-format "#[fg=#ccc3d3,bold] #I:#W "
set -g window-status-activity-style "fg=#e0c78c,bg=default"
set -g window-status-bell-style "fg=#ff9d91,bg=default,bold"
set -g pane-border-style "fg=#484b50,bg=default"
set -g pane-active-border-style "fg=#998f9f,bg=default"
set -g message-style "fg=#e5e3e6,bg=default"
set -g message-command-style "fg=#e5e3e6,bg=default"
set -g mode-style "fg=#ffffff,bg=#39363d"

# Vim-Tmux-Navigator keybinds
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
