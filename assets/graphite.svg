<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Graphite</title>
  <desc>The archelinux symbol in folded graphite, edged with light on a black ground.</desc>
  <defs>
    <radialGradient id="sky" cx="75%" cy="43%" r="68%">
      <stop stop-color="#363b3e"/><stop offset=".57" stop-color="#111417"/><stop offset="1" stop-color="#020304"/>
    </radialGradient>
    <linearGradient id="ridge" x2="1" y2=".32" gradientUnits="objectBoundingBox">
      <stop stop-color="#040506"/><stop offset=".44" stop-color="#101315"/>
      <stop offset=".76" stop-color="#232729"/><stop offset="1" stop-color="#0c0e10"/>
    </linearGradient>
    <linearGradient id="edge" x2="1" y2=".4">
      <stop stop-color="#17191c"/><stop offset=".55" stop-color="#54575b"/>
      <stop offset=".72" stop-color="#767b7f"/><stop offset="1" stop-color="#232629"/>
    </linearGradient>
    <linearGradient id="left" x1="1" y1="0" x2=".17" y2="1">
      <stop stop-color="#eaebeb"/><stop offset=".25" stop-color="#85898b"/>
      <stop offset=".65" stop-color="#45494c"/><stop offset="1" stop-color="#272a2c"/>
    </linearGradient>
    <linearGradient id="right" x1="0" y1="0" x2=".84" y2="1">
      <stop stop-color="#b0a9b1"/><stop offset=".45" stop-color="#616468"/><stop offset="1" stop-color="#313436"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1=".8" x2=".85" y2=".1">
      <stop stop-color="#0d1012"/><stop offset=".6" stop-color="#272a2d"/><stop offset="1" stop-color="#737679"/>
    </linearGradient>
  </defs>
  <rect width="1920" height="1080" fill="url(#sky)"/>
  <path d="M0 940 C395 940 734 755 1065 697 S1680 579 1920 350 V1080 H0Z" fill="url(#ridge)"/>
  <path d="M0 940 C395 940 734 755 1065 697 S1680 579 1920 350" fill="none" stroke="url(#edge)" opacity=".48"/>
  <path d="M0 1015 C586 1059 790 860 1190 792 S1721 668 1920 594 V1080 H0Z" fill="url(#ridge)"/>
  <path d="M0 1015 C586 1059 790 860 1190 792 S1721 668 1920 594" fill="none" stroke="url(#edge)" opacity=".7"/>
  <path d="M265 1080 C732 1073 910 967 1197 911 S1757 788 1920 710 V1080Z" fill="#080a0c"/>
  <path d="M265 1080 C732 1073 910 967 1197 911 S1757 788 1920 710" fill="none" stroke="url(#edge)" opacity=".45"/>
  <!-- The two silhouettes follow the project's existing 208-unit symbol. -->
  <g transform="translate(1130 280) scale(1.9)">
    <path d="M131 0 74 197 0 208Z" fill="url(#left)"/>
    <path d="M131 0 74 197 49 190Z" fill="url(#fold)"/>
    <path d="M130 61 208 208 165 197 119 98Z" fill="url(#right)"/>
    <path d="M130 61 208 208 184 194Z" fill="url(#fold)"/>
    <path d="M0 208 131 0 49 190 M130 61 184 194" fill="none" stroke="#f1eeef" opacity=".48" stroke-width=".45"/>
  </g>
</svg>
