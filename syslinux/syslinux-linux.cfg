LABEL arch-zen
MENU LABEL Arche Linux Zen (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-zen
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-zen.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
MENU COLOR title 0 #ffffffff #00000000 none
MENU COLOR sel 7 #ff000000 #ffffffff
MENU COLOR border 0 #ffffffff #00000000 none
MENU COLOR background 0 #00000000 #00000000 none

LABEL arch-lts
MENU LABEL Arche Linux LTS (x86_64, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux-lts
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux-lts.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%
